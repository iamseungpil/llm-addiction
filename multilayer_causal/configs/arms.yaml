# Arm registry — multilayer causal intervention (spec 2026-06-10).
# layers: [a, b] = INCLUSIVE range; n: default trials; modes:
#   anchor_minus / anchor_plus / patch / subspace / steer
defaults:
  model: gemma
  task: sm
  n: 50

arms:
  # ---- E1: anchors + multi-layer paired patch sweep -----------------------
  - {id: e1_anchor_minus, phase: e1, mode: anchor_minus}
  - {id: e1_anchor_plus,  phase: e1, mode: anchor_plus}
  - {id: e1_full,         phase: e1, mode: patch, layers: [0, 41], log_vectors: true}
  - {id: e1_cum_b8,       phase: e1, mode: patch, layers: [0, 8]}
  - {id: e1_cum_b16,      phase: e1, mode: patch, layers: [0, 16]}
  - {id: e1_cum_b22,      phase: e1, mode: patch, layers: [0, 22]}
  - {id: e1_cum_b30,      phase: e1, mode: patch, layers: [0, 30]}
  - {id: e1_cum_b36,      phase: e1, mode: patch, layers: [0, 36]}
  - {id: e1_cum_t8,       phase: e1, mode: patch, layers: [8, 41]}
  - {id: e1_cum_t16,      phase: e1, mode: patch, layers: [16, 41]}
  - {id: e1_cum_t22,      phase: e1, mode: patch, layers: [22, 41]}
  - {id: e1_cum_t30,      phase: e1, mode: patch, layers: [30, 41]}
  - {id: e1_win_0,        phase: e1, mode: patch, layers: [0, 5]}
  - {id: e1_win_6,        phase: e1, mode: patch, layers: [6, 11]}
  - {id: e1_win_12,       phase: e1, mode: patch, layers: [12, 17]}
  - {id: e1_win_18,       phase: e1, mode: patch, layers: [18, 23]}
  - {id: e1_win_24,       phase: e1, mode: patch, layers: [24, 29]}
  - {id: e1_win_30,       phase: e1, mode: patch, layers: [30, 35]}
  - {id: e1_win_36,       phase: e1, mode: patch, layers: [36, 41]}
  # ---- E2/E3 arms are appended after the E1 gate fixes S* ------------------
  # ---- E2: rank-r subspace patch at S* = L18-23 (fixed from E1, 2026-06-10) ----
  - {id: e2_r1, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis_npz: multilayer_causal/assets/pca_bases.npz}
  - {id: e2_r2, phase: e2, mode: subspace, layers: [18, 23], r: 2, basis_npz: multilayer_causal/assets/pca_bases.npz}
  - {id: e2_r8, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis_npz: multilayer_causal/assets/pca_bases.npz}
  - {id: e2_r32, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis_npz: multilayer_causal/assets/pca_bases.npz}
  - {id: e2_r128, phase: e2, mode: subspace, layers: [18, 23], r: 128, basis_npz: multilayer_causal/assets/pca_bases.npz}
  # E2 random-subspace controls (Makelov-illusion defence)
  - {id: e2_rnd_r1_s0, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061100}
  - {id: e2_rnd_r1_s1, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061101}
  - {id: e2_rnd_r1_s2, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061102}
  - {id: e2_rnd_r1_s3, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061103}
  - {id: e2_rnd_r1_s4, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061104}
  - {id: e2_rnd_r1_s5, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061105}
  - {id: e2_rnd_r1_s6, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061106}
  - {id: e2_rnd_r1_s7, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061107}
  - {id: e2_rnd_r1_s8, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061108}
  - {id: e2_rnd_r1_s9, phase: e2, mode: subspace, layers: [18, 23], r: 1, basis: random, basis_seed: 2026061109}
  - {id: e2_rnd_r8_s0, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061800}
  - {id: e2_rnd_r8_s1, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061801}
  - {id: e2_rnd_r8_s2, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061802}
  - {id: e2_rnd_r8_s3, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061803}
  - {id: e2_rnd_r8_s4, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061804}
  - {id: e2_rnd_r8_s5, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061805}
  - {id: e2_rnd_r8_s6, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061806}
  - {id: e2_rnd_r8_s7, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061807}
  - {id: e2_rnd_r8_s8, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061808}
  - {id: e2_rnd_r8_s9, phase: e2, mode: subspace, layers: [18, 23], r: 8, basis: random, basis_seed: 2026061809}
  - {id: e2_rnd_r32_s0, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064200}
  - {id: e2_rnd_r32_s1, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064201}
  - {id: e2_rnd_r32_s2, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064202}
  - {id: e2_rnd_r32_s3, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064203}
  - {id: e2_rnd_r32_s4, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064204}
  - {id: e2_rnd_r32_s5, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064205}
  - {id: e2_rnd_r32_s6, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064206}
  - {id: e2_rnd_r32_s7, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064207}
  - {id: e2_rnd_r32_s8, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064208}
  - {id: e2_rnd_r32_s9, phase: e2, mode: subspace, layers: [18, 23], r: 32, basis: random, basis_seed: 2026064209}
  # ---- E3a: additive steering along the G-axis at S* = L18-23 ----
  - {id: e3a_m20, phase: e3a, mode: steer, layers: [18, 23], alpha: -2.0, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_m10, phase: e3a, mode: steer, layers: [18, 23], alpha: -1.0, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_m05, phase: e3a, mode: steer, layers: [18, 23], alpha: -0.5, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_a00, phase: e3a, mode: steer, layers: [18, 23], alpha: 0.0, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_p05, phase: e3a, mode: steer, layers: [18, 23], alpha: 0.5, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_p10, phase: e3a, mode: steer, layers: [18, 23], alpha: 1.0, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_p20, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, directions_npz: multilayer_causal/assets/directions.npz}
  # E3a random-direction controls at alpha=+2
  - {id: e3a_rnd_s0, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062000, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s1, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062001, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s2, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062002, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s3, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062003, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s4, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062004, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s5, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062005, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s6, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062006, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s7, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062007, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s8, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062008, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_rnd_s9, phase: e3a, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026062009, directions_npz: multilayer_causal/assets/directions.npz}
  # ---- E1c: CONFIRMATORY n=200, held-out states (offset 100), fresh seeds ----
  - {id: e1c_anchor_minus, phase: e1c, mode: anchor_minus, n: 200, seed_base: 1000042, state_offset: 100}
  - {id: e1c_anchor_plus,  phase: e1c, mode: anchor_plus,  n: 200, seed_base: 1000042, state_offset: 100}
  - {id: e1c_win18,        phase: e1c, mode: patch, layers: [18, 23], n: 200, seed_base: 1000042, state_offset: 100}
  # ---- E3i: I_BA BEHAVIOUR-axis steering at S*=L18-23 (orthogonal to G-axis, cos~0.07) ----
  - {id: e3i_m20, phase: e3i, mode: steer, layers: [18, 23], alpha: -2.0, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_m10, phase: e3i, mode: steer, layers: [18, 23], alpha: -1.0, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_a00, phase: e3i, mode: steer, layers: [18, 23], alpha: 0.0, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_p10, phase: e3i, mode: steer, layers: [18, 23], alpha: 1.0, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_p20, phase: e3i, mode: steer, layers: [18, 23], alpha: 2.0, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_p40, phase: e3i, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_iba.npz}
  # E3i random-direction controls at alpha=+2
  - {id: e3i_rnd_s0, phase: e3i, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026063000, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_rnd_s1, phase: e3i, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026063001, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_rnd_s2, phase: e3i, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026063002, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_rnd_s3, phase: e3i, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026063003, directions_npz: multilayer_causal/assets/directions_iba.npz}
  - {id: e3i_rnd_s4, phase: e3i, mode: steer, layers: [18, 23], alpha: 2.0, direction: random, dir_seed: 2026063004, directions_npz: multilayer_causal/assets/directions_iba.npz}
  # G-axis high-dose extension (dose-sufficiency check)
  - {id: e3a_p40, phase: e3a, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions.npz}
  - {id: e3a_p80, phase: e3a, mode: steer, layers: [18, 23], alpha: 8.0, directions_npz: multilayer_causal/assets/directions.npz}
  # ==== W1 discovery arms (spec 2026-06-10 W0-W2 section-interleaved) ========
  # ---- w1ro: §4.1 readout-axis dose-response (Ridge readout direction) ----
  - {id: w1ro_m20, phase: w1ro, mode: steer, layers: [18, 23], alpha: -2.0, directions_npz: multilayer_causal/assets/directions_readout.npz}
  - {id: w1ro_a00, phase: w1ro, mode: steer, layers: [18, 23], alpha: 0.0, directions_npz: multilayer_causal/assets/directions_readout.npz}
  - {id: w1ro_p20, phase: w1ro, mode: steer, layers: [18, 23], alpha: 2.0, directions_npz: multilayer_causal/assets/directions_readout.npz}
  - {id: w1ro_p40, phase: w1ro, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_readout.npz}
  # ---- w1lc: §4.1 loss-chasing probe arms (3 generations: decision+LOSS+WIN) ----
  - {id: w1lc_anchor_minus, phase: w1lc, mode: anchor_minus, probe: true}
  - {id: w1lc_anchor_plus, phase: w1lc, mode: anchor_plus, probe: true}
  - {id: w1lc_patch, phase: w1lc, mode: patch, layers: [18, 23], probe: true}
  - {id: w1lc_iba_p40, phase: w1lc, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_iba_v2.npz, probe: true}
  - {id: w1lc_ilc_p20, phase: w1lc, mode: steer, layers: [18, 23], alpha: 2.0, directions_npz: multilayer_causal/assets/directions_ilc.npz, probe: true}
  - {id: w1lc_ilc_p40, phase: w1lc, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_ilc.npz, probe: true}
  - {id: w1lc_rnd, phase: w1lc, mode: steer, layers: [18, 23], alpha: 4.0, direction: random, dir_seed: 2026064000, directions_npz: multilayer_causal/assets/directions_iba_v2.npz, probe: true}
  # ---- w1s: §4.1 selectivity matrix fill (I_LC / I_EC axes, single decision) ----
  - {id: w1s_ilc_p20, phase: w1s, mode: steer, layers: [18, 23], alpha: 2.0, directions_npz: multilayer_causal/assets/directions_ilc.npz}
  - {id: w1s_ilc_p40, phase: w1s, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_ilc.npz}
  - {id: w1s_iec_p20, phase: w1s, mode: steer, layers: [18, 23], alpha: 2.0, directions_npz: multilayer_causal/assets/directions_iec.npz}
  - {id: w1s_iec_p40, phase: w1s, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_iec.npz}
  # ---- w1ic: §4.2 cross-task causal transfer (investment choice) ----
  - {id: w1ic_anchor, phase: w1ic, task: ic, mode: anchor_minus}
  - {id: w1ic_smiba_p20, phase: w1ic, task: ic, mode: steer, layers: [18, 23], alpha: 2.0, directions_npz: multilayer_causal/assets/directions_iba_v2.npz}
  - {id: w1ic_smiba_p40, phase: w1ic, task: ic, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_iba_v2.npz}
  - {id: w1ic_icax_p40, phase: w1ic, task: ic, mode: steer, layers: [18, 23], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_ic.npz}
  - {id: w1ic_rnd_s0, phase: w1ic, task: ic, mode: steer, layers: [18, 23], alpha: 4.0, direction: random, dir_seed: 2026065000, directions_npz: multilayer_causal/assets/directions_ic.npz}
  - {id: w1ic_rnd_s1, phase: w1ic, task: ic, mode: steer, layers: [18, 23], alpha: 4.0, direction: random, dir_seed: 2026065001, directions_npz: multilayer_causal/assets/directions_ic.npz}
  # ---- w1b: §4.3 bridge — non-contiguous layer set {8,12,22,25,30} ----
  - {id: w1b_patch5, phase: w1b, mode: patch, layers_list: [8, 12, 22, 25, 30]}
  - {id: w1b_steer5, phase: w1b, mode: steer, layers_list: [8, 12, 22, 25, 30], alpha: 4.0, directions_npz: multilayer_causal/assets/directions_iba_v2.npz}
  # ---- w1e: §4.3 edge — width-2 windows + width-4 flanks around S* ----
  - {id: w1e_1617, phase: w1e, mode: patch, layers: [16, 17]}
  - {id: w1e_1819, phase: w1e, mode: patch, layers: [18, 19]}
  - {id: w1e_2021, phase: w1e, mode: patch, layers: [20, 21]}
  - {id: w1e_2223, phase: w1e, mode: patch, layers: [22, 23]}
  - {id: w1e_2425, phase: w1e, mode: patch, layers: [24, 25]}
  - {id: w1e_1821, phase: w1e, mode: patch, layers: [18, 21]}
  - {id: w1e_2023, phase: w1e, mode: patch, layers: [20, 23]}
