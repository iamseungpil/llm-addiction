# sec4 Wave-11 IC write-window SCAN (§4.2 model symmetry, LLaMA). W9's llama
# matrix reused the SM write window (L14-19) for IC, so its IC self-cell was
# weak (icrc->ic wrong-signed). W11 finds IC's OWN causal write window BEFORE
# the matrix re-run (the follow-up): it scans four candidate windows
# {[10,15],[12,17],[14,19],[16,21]} (llama 32L) at alpha {-3,0,+3}, each window
# steering its OWN llama_investment_choice_ic_rc_behavioural_L{lo}_{hi} axis
# (ic_rc = risky OPTION choice>=3, built by indicator_axes --build-llama-windows
# --task investment_choice; behavioural hidden mean-diff, no SAE decoder). Plus
# a no-steer baseline + 3 random nulls (their axis is the middle L14-19 window).
# The a0 cell in each window ladder is that window's own no-steer baseline. The
# LLaMA +/-G gap is small so the scan reads the ABSOLUTE effect = IC risky rate
# (= mean of the runner's `risky` flag over parse_ok rows). n=200 (higher than
# W9's 150 to fight the small llama headroom). state_offset 0 replays
# ic.replay_game_ids[0:200], held out of the axis build. ISOLATED via
# arms_sec4_w11ic.yaml, results/sec4_w11, MLC_SYNC_EVERY 50. 16 arms.
defaults:
  model: llama
  task: ic
  n: 200
  seed_base: 7000042
  state_offset: 0
  prompt_set: addiction_role_gm
  log_vectors: true

arms:
  - {id: sec4_w11ic_L10_15_am3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [10, 15], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L10_15.npz}
  - {id: sec4_w11ic_L10_15_a0, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [10, 15], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L10_15.npz}
  - {id: sec4_w11ic_L10_15_ap3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [10, 15], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L10_15.npz}
  - {id: sec4_w11ic_L12_17_am3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [12, 17], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L12_17.npz}
  - {id: sec4_w11ic_L12_17_a0, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [12, 17], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L12_17.npz}
  - {id: sec4_w11ic_L12_17_ap3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [12, 17], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L12_17.npz}
  - {id: sec4_w11ic_L14_19_am3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [14, 19], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L14_19.npz}
  - {id: sec4_w11ic_L14_19_a0, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [14, 19], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L14_19.npz}
  - {id: sec4_w11ic_L14_19_ap3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [14, 19], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L14_19.npz}
  - {id: sec4_w11ic_L16_21_am3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [16, 21], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L16_21.npz}
  - {id: sec4_w11ic_L16_21_a0, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [16, 21], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L16_21.npz}
  - {id: sec4_w11ic_L16_21_ap3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [16, 21], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L16_21.npz}
  - {id: sec4_w11ic_null1_ap3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [14, 19], alpha: 3.0, direction: random, dir_seed: 700004201, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L14_19.npz, log_vectors: false}
  - {id: sec4_w11ic_null2_am3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [14, 19], alpha: -3.0, direction: random, dir_seed: 700004202, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L14_19.npz, log_vectors: false}
  - {id: sec4_w11ic_null3_ap3, phase: sec4_w11, task: ic, state_offset: 0, mode: steer, layers: [14, 19], alpha: 3.0, direction: random, dir_seed: 700004203, directions_npz: multilayer_causal/assets/sec4/llama_investment_choice_ic_rc_behavioural_L14_19.npz, log_vectors: false}
  - {id: sec4_w11ic_base, phase: sec4_w11, task: ic, state_offset: 0, mode: anchor_minus, layers: [14, 19], log_vectors: false}
