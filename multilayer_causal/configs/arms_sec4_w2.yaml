# sec4 Wave-2 COMMON-AXIS arm registry — §4 causal-strengthening (Gemma SM, 2026-07-06).
# NORTH STAR: find ONE shared internal axis that drives gambling behaviour
# CONSISTENTLY across irrationality indicators. Wave-1 showed the I_BA behavioural
# axis (L16-21) writes betting (bet_ratio 0.014->0.256 over alpha -3..+3, rho 0.96)
# AND co-moves extreme-betting I_EC — but read=/=write stayed UNRESOLVED under a
# thin single-dose null. Wave-2 asks whether the SVD top-1 SHARED axis of the I_BA
# and I_EC behavioural axes moves BOTH indicators monotonically ABOVE a THICK null
# slope band (each random direction dosed at -3 AND +3 so its slope is estimable).
# Four steered axes x alpha {-3..+3} = 28 dose arms (each steers its OWN npz:
# behav_iba, behav_iec, shared, confound) + 20 random-direction nulls x {-3,+3} =
# 40 null arms + a no-steer baseline = 69 arms. Every arm replays the EXACT
# addiction prompts (prompt_set: addiction_role_gm) at L16-21 with alpha-independent
# seeds (seed_base + 997*i) on the HELD-OUT slice (state_offset 300), log_vectors
# for the manip check. ISOLATION: loaded ONLY via MLC_ARMS_YAML; SM-only; HF prefix
# experiments/sec4_causal, results/sec4_w2. Axes built by indicator_axes.py --wave2.
defaults:
  model: gemma
  task: sm
  n: 200
  seed_base: 2000042
  state_offset: 300
  prompt_set: addiction_role_gm
  log_vectors: true

arms:
  # ---- I_BA behavioural axis (Wave-1 heater): moves betting ----
  - {id: sec4_w2_behav_iba_am3, phase: sec4_w2, mode: steer, layers: [16, 21], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w2_behav_iba_am2, phase: sec4_w2, mode: steer, layers: [16, 21], alpha: -2.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w2_behav_iba_am1, phase: sec4_w2, mode: steer, layers: [16, 21], alpha: -1.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w2_behav_iba_a0, phase: sec4_w2, mode: steer, layers: [16, 21], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w2_behav_iba_ap1, phase: sec4_w2, mode: steer, layers: [16, 21], alpha: 1.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w2_behav_iba_ap2, phase: sec4_w2, mode: steer, layers: [16, 21], alpha: 2.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w2_behav_iba_ap3, phase: sec4_w2, mode: steer, layers: [16, 21], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
