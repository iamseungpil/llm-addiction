# sec4 Wave-4 arm registry — Q2 rung-2 (MW third-task transfer) + Q3 rung-2
# (2x2 autonomy: +M ladder + same-wave -G control), 2026-07-07.
#
# Q2 rung-2 (goals-v2 ladder): does the Wave-3 IC finding — geometry shared,
# causal control SIGN-INVERTED and one-sided (the SM-calming -alpha direction
# RAISES risky choice on identical seeds) — replicate on the THIRD task (MW)?
#   sec4_w4_sh3_mw_*   the 3-task SVD shared axis at MW sigma-units
#                      (gemma_shared3_iba_behavioural_mwscale.npz) dosed on the
#                      frozen MW pool. MW measures bet_ratio (variable betting),
#                      so the expression-matched outcome is I_BA itself.
#   sec4_w4_mw_own_*   MW's own behavioural axis = within-task positive control.
#   sec4_w4_mw_null*   random directions at MW sigma-units, +/-3 pairs -> MW
#                      null slope band.  sec4_w4_mw_baseline = no-steer floor.
#   The W4 node build excludes mw.replay_game_ids from the axis build (held-out
#   disjointness, mirrors the IC guard added in Wave-3).
#
# Q3 rung-2: Wave-3 showed slope(+G) > slope(-G/W1) (CI excl 0). 2x2 completion:
#   sec4_w4_plusM_*    the SM behavioural I_BA axis dosed on the +M twin prompt
#                      (twin: M — reward-maximisation module added verbatim).
#   sec4_w4_minusG_*   same-wave -G re-ladder (3 doses) so the G comparison has
#                      a WITHIN-wave control (rules out wave effects in the
#                      W3-plusG vs W1-minusG cross-wave slope comparison).
#   sec4_w4_plusM_baseline  no-steer +M floor (anchor twin M).
# ISOLATION: loaded ONLY via MLC_ARMS_YAML; new HF phase sec4_w4.
defaults:
  model: gemma
  task: sm
  n: 200
  seed_base: 2000042
  state_offset: 300
  prompt_set: addiction_role_gm
  log_vectors: true

arms:
  # ---- Q2 rung-2: shared3 axis on MW (expression-matched: MW bet_ratio) ----
  - {id: sec4_w4_sh3_mw_am3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/gemma_shared3_iba_behavioural_mwscale.npz}
  - {id: sec4_w4_sh3_mw_am2, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: -2.0, directions_npz: multilayer_causal/assets/sec4/gemma_shared3_iba_behavioural_mwscale.npz}
  - {id: sec4_w4_sh3_mw_am1, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: -1.0, directions_npz: multilayer_causal/assets/sec4/gemma_shared3_iba_behavioural_mwscale.npz}
  - {id: sec4_w4_sh3_mw_a0, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/gemma_shared3_iba_behavioural_mwscale.npz}
  - {id: sec4_w4_sh3_mw_ap1, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 1.0, directions_npz: multilayer_causal/assets/sec4/gemma_shared3_iba_behavioural_mwscale.npz}
  - {id: sec4_w4_sh3_mw_ap2, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 2.0, directions_npz: multilayer_causal/assets/sec4/gemma_shared3_iba_behavioural_mwscale.npz}
  - {id: sec4_w4_sh3_mw_ap3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/gemma_shared3_iba_behavioural_mwscale.npz}
  # ---- Q2 rung-2: MW's own axis (within-task positive control) ----
  - {id: sec4_w4_mw_own_am3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz}
  - {id: sec4_w4_mw_own_a0, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz}
  - {id: sec4_w4_mw_own_ap3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz}
  # ---- Q2 rung-2: MW baseline + thick-ish null (3 dirs x +/-3) ----
  - {id: sec4_w4_mw_baseline, phase: sec4_w4, task: mw, state_offset: 0, mode: anchor_minus, layers: [16, 21], log_vectors: false}
  - {id: sec4_w4_mw_null1_am3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: -3.0, direction: random, dir_seed: 2026070741, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz, log_vectors: false}
  - {id: sec4_w4_mw_null1_ap3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 3.0, direction: random, dir_seed: 2026070741, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz, log_vectors: false}
  - {id: sec4_w4_mw_null2_am3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: -3.0, direction: random, dir_seed: 2026070742, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz, log_vectors: false}
  - {id: sec4_w4_mw_null2_ap3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 3.0, direction: random, dir_seed: 2026070742, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz, log_vectors: false}
  - {id: sec4_w4_mw_null3_am3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: -3.0, direction: random, dir_seed: 2026070743, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz, log_vectors: false}
  - {id: sec4_w4_mw_null3_ap3, phase: sec4_w4, task: mw, state_offset: 0, mode: steer, layers: [16, 21], alpha: 3.0, direction: random, dir_seed: 2026070743, directions_npz: multilayer_causal/assets/sec4/gemma_mystery_wheel_i_ba_behavioural.npz, log_vectors: false}
  # ---- Q3 rung-2: +M twin ladder (reward-max module) ----
  - {id: sec4_w4_plusM_am3, phase: sec4_w4, mode: steer, twin: M, layers: [16, 21], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w4_plusM_am2, phase: sec4_w4, mode: steer, twin: M, layers: [16, 21], alpha: -2.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w4_plusM_am1, phase: sec4_w4, mode: steer, twin: M, layers: [16, 21], alpha: -1.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w4_plusM_a0, phase: sec4_w4, mode: steer, twin: M, layers: [16, 21], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w4_plusM_ap1, phase: sec4_w4, mode: steer, twin: M, layers: [16, 21], alpha: 1.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w4_plusM_ap2, phase: sec4_w4, mode: steer, twin: M, layers: [16, 21], alpha: 2.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w4_plusM_ap3, phase: sec4_w4, mode: steer, twin: M, layers: [16, 21], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  # ---- Q3 rung-2: same-wave -G control re-ladder ----
  - {id: sec4_w4_minusG_am3, phase: sec4_w4, mode: steer, layers: [16, 21], alpha: -3.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w4_minusG_a0, phase: sec4_w4, mode: steer, layers: [16, 21], alpha: 0.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
  - {id: sec4_w4_minusG_ap3, phase: sec4_w4, mode: steer, layers: [16, 21], alpha: 3.0, directions_npz: multilayer_causal/assets/sec4/gemma_slot_machine_i_ba_behavioural.npz}
