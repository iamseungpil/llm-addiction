  - {id: xtask_rnd_mw_a2, phase: xtask_dose, task: mw, mode: steer, layers: [16, 21], alpha: 2.0, direction: random, dir_seed: 2026172002, directions_npz: multilayer_causal/assets/xtask/directions_bk_single_mw_to_mw.npz, n: 50, seed_base: 2000042, state_offset: 0}
