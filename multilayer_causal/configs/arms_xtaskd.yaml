# xtaskd arm registry — Stage D: WRITE-LOCALITY width / cumulative-layer sweep (2026-06-18).
# Localises the I_BA behavioural causal lever (directions_iba_v2.npz, the 'one
# axis drives all three irrationality indices' axis) by steering it (+4.0) on SM
# across window GEOMETRY only, measuring recovery vs the ±G anchors
# (w2_anchor_minus/plus, reused from HF: -G br 0.061, +G br 0.202).
#   single-layer (width-1): is one layer enough? where does it peak (inside L16-21)?
#   cumulative window: does recovery saturate at ~L16-21 and NOT grow (or derail,
#     parse drop) when widened to L14-23 / L12-25 / L8-29 / all 42?
# log_vectors:true = manipulation check (projection landed) per arm. ISOLATION:
# loaded ONLY via MLC_ARMS_YAML; SM-only; reuses the existing iba_v2 asset + ±G
# anchors; new HF prefix experiments/xtaskd/, results/xtaskd. NO new axis/catalog.
defaults:
  model: gemma
  task: sm
  n: 50

arms:
  # ---- single-layer (width-1): localization profile ----
  - {id: xtaskd_L12_w1, phase: xtaskd, mode: steer, layers: [12, 12], alpha: 4.0, directions_npz: multilayer_causal/assets/w2/directions_iba_v2.npz, n: 50, seed_base: 2000042, state_offset: 300, log_vectors: true}
